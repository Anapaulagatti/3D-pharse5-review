name: Verify already published exact approved game (no deployment)
on:
  push:
    branches: [main]
    paths: ['live-review-check/request.json']
permissions:
  contents: write
concurrency:
  group: verify-published-review
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact approved verification request
        run: |
          python - <<'PY'
          import json
          r=json.load(open('live-review-check/request.json'));q=json.load(open('approved-releases/current.approved.json'))
          assert q['decision']=='APPROVED_PUBLIC_PREVIEW'and q['artifactCommit']==r['artifactCommit']and q['manifestSHA256']==r['manifestSHA256']
          assert r['url']=='https://anapaulagatti.github.io/3D-pharse5-review/'
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test dependencies only; never build or deploy game
        run: |
          mkdir qa-runner
          cp verify_live.mjs verify_motion.mjs review-source.json qa-runner/
          cp approved-releases/current.approved.json qa-runner/approved-receipt.json
          npm install --prefix qa-runner --no-save --package-lock=false @playwright/test@1.64.1
          cd qa-runner
          npx playwright install --with-deps chromium
      - name: Open actual HTTPS game and verify assets, NPCs, input, cosmetics and mobile
        env:
          LIVE_URL: https://anapaulagatti.github.io/3D-pharse5-review/
        working-directory: qa-runner
        run: node verify_live.mjs
      - name: Record actual proof, never inferred PASS
        if: always()
        env:
          VERIFICATION_MODE: read-only-post-deployment-browser
          DEPLOYMENT_RUN_ID: '41074415941'
        run: python record_live_qa.py qa-runner/evidence/LIVE_QA.json approved-releases/current.approved.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-readonly-live-verification
          path: qa-runner/evidence/LIVE_QA.json
      - name: Preserve actual selected proof on separate branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.repository }}
        run: |
          mkdir proof-output
          git -C proof-output init
          git -C proof-output remote add origin "https://github.com/$TARGET.git"
          git -C proof-output config credential.helper '!gh auth git-credential'
          git -C proof-output fetch origin live-verification
          git -C proof-output checkout -b live-verification FETCH_HEAD
          mkdir -p proof-output/runs
          cp live-verification.json proof-output/latest.json
          cp live-verification.json "proof-output/runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          git -C proof-output config user.name 'github-actions[bot]'
          git -C proof-output config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C proof-output add latest.json runs/
          git -C proof-output commit -m 'Record actual published HTTPS browser checks; no deployment'
          git -C proof-output push origin HEAD:live-verification
